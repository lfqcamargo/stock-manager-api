name: Deploy API

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: ./
        run: npm ci

      - name: Run tests
        working-directory: ./
        run: npm run test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t ${{ vars.DOCKERHUB_USERNAME }}/stock-api:latest \
            ./

      - name: Push Docker image
        run: docker push ${{ vars.DOCKERHUB_USERNAME }}/stock-api:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ vars.DOCKERHUB_USERNAME }}/stock-api:latest

            docker stop stock-api 2>/dev/null || true
            docker rm stock-api 2>/dev/null || true

            docker run -d \
              --name stock-api \
              --network stock-network \
              --restart unless-stopped \
              -p 127.0.0.1:${{ vars.PORT }}:3000 \
              -e PORT="3000" \
              -e APP_URL="${{ vars.APP_URL }}" \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e JWT_PRIVATE_KEY="${{ secrets.JWT_PRIVATE_KEY }}" \
              -e JWT_PUBLIC_KEY="${{ secrets.JWT_PUBLIC_KEY }}" \
              -e JWT_ACCESS_EXPIRES_IN="${{ vars.JWT_ACCESS_EXPIRES_IN }}" \
              -e JWT_REFRESH_EXPIRES_IN="${{ vars.JWT_REFRESH_EXPIRES_IN }}" \
              -e PASSWORD_MASTER="${{ secrets.PASSWORD_MASTER }}" \
              ${{ vars.DOCKERHUB_USERNAME }}/stock-api:latest

            echo "✅ Deployment API completed!"
